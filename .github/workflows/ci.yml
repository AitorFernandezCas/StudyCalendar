name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:deployment
      - run: npm run test:calendar
      - run: npm run test:sync
      - run: npm run build:production
        env:
          VITE_API_URL: https://studycalendar-api.example.com
          VITE_SUPABASE_URL: https://studycalendar-ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ''
      SUPABASE_PUBLISHABLE_KEY: ''
      FRONTEND_ORIGIN: http://localhost:5173
      APP_TIMEZONE: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend -q
      - run: python backend/wsgi_smoke.py

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :core:test :app:assembleDebug :app:lintDebug --no-daemon

  ci:
    name: CI completa
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [frontend, backend, android]
    if: always()
    steps:
      - name: Exigir todos los resultados satisfactorios
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: test "$FRONTEND_RESULT" = success && test "$BACKEND_RESULT" = success && test "$ANDROID_RESULT" = success
